[build]
  publish = "."
  command = "python3 construir.py"

# Links viejos de Erika
[[redirects]]
  from = "/erica/*"
  to = "/kika/"
  status = 301

[[redirects]]
  from = "/erika/*"
  to = "/kika/"
  status = 301

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
