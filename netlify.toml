[build]
  publish = "."
  command = "python3 construir.py"

# Links viejos de Erika
[[redirects]]
  from = "/erica/*"
  to = "/kika/"
  status = 301

[[redirects]]
  from = "/erika/*"
  to = "/kika/"
  status = 301

# Un link mal escrito cae en la invitación general
[[redirects]]
  from = "/*"
  to = "/"
  status = 302

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
